# Checks this repository: workflow syntax (actionlint) and secrets (gitleaks).
name: self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows and workflow templates
        run: |
          "$RUNNER_TEMP/actionlint" -color
          "$RUNNER_TEMP/actionlint" -color workflow-templates/*.yml

  secrets:
    uses: ./.github/workflows/reusable-secret-scan.yml
    permissions:
      contents: read
