# Reusable: scan the full git history for secrets with gitleaks.
# Replaces GitHub secret scanning / push protection, which are paid features for private repositories.
#
# Caller:
#   jobs:
#     secrets:
#       uses: ChevoLabs/.github/.github/workflows/reusable-secret-scan.yml@v1
#       permissions:
#         contents: read
name: reusable-secret-scan

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to a gitleaks config in the calling repo (empty = .gitleaks.toml if present, else defaults)
        type: string
        default: ""

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --verbose --exit-code 1)
          if [ -n "$CONFIG_PATH" ]; then
            args+=(--config "$CONFIG_PATH")
          elif [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
