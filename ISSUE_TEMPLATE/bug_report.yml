name: Bug
description: Something is broken or behaves differently from the documentation.
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [local, staging, production]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, infra, docs, other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots or log lines (with tokens, emails and phone numbers removed).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no secrets and no personal data
          required: true
