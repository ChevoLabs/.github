# Node.js (npm) repositories → .github/dependabot.yml. Add project labels to `labels` if the project uses them.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    labels: ["dependencies"]
    commit-message: { prefix: "chore" }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    labels: ["dependencies"]
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
