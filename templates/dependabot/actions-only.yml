# Repositories without a package manager (docs, configuration) → .github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    labels: ["dependencies"]
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
